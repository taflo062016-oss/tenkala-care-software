name: Construire et publier TENKALA CARE SOFTWARE pour Windows
on:
  push:
    branches: [ main ]
    paths-ignore: [ 'referentiel/**', '*.txt', 'manifest.json', 'sw.js', '*.png' ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      # 1. Fabrication de l'installateur (sans publication)
      - run: npx electron-builder --win --publish never
      # 2. Publication de la version (Release) avec latest.yml pour les mises Ã  jour automatiques
      - name: Publier la version sur GitHub Releases
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          V=$(node -p "require('./package.json').version")
          if gh release view "v$V" >/dev/null 2>&1; then
            echo "La version v$V existe dÃ©jÃ  : fichiers remplacÃ©s."
            gh release upload "v$V" dist/*.exe dist/*.blockmap dist/latest.yml --clobber
          else
            gh release create "v$V" dist/*.exe dist/*.blockmap dist/latest.yml --title "TENKALA CARE SOFTWARE $V" --notes "Version $V. Les logiciels dÃ©jÃ  installÃ©s se mettent Ã  jour automatiquement." --latest
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: TENKALA-CARE-SOFTWARE-Windows
          path: |
            dist/*.exe
            dist/latest.yml
